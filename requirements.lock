# 与 requirements.txt（人读下限式声明，面向新安装）并存：
#   - 新装环境 → 先按 lock 装环境（开发/打包/CI 三方一致）
#   - requirements.txt → 继续保留，作为"最低要求"声明给新装用户
#   - 真值 → 本 lock 文件（精确 ==）
